[workspace]
resolver = "3"
members = ["native", "desktop"]
default-members = ["desktop"]
# Keep downloaded SDK crates and generated hosts in their own workspaces.
exclude = [".tools/nsh/0.1.1/source", "ui/.nsh/rust"]

[workspace.package]
version = "0.2.12"
edition = "2024"
license = "MIT"

[workspace.dependencies]
nsh-core = "=0.1.1"
nsh-engine = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
