name: NSH Release

on:
  push:
    tags: ["nsh-v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
    steps:
      - uses: actions/checkout@v7
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            .nsh/rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:native
      - run: pnpm test:ui
      - run: pnpm package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.zip
            dist/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish dedicated NSH release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: nsh-*
          merge-multiple: true
          path: dist/release
      - name: Verify tag and create NSH manifest
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "nsh-v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          archives=(dist/release/*.tar.gz dist/release/*.zip)
          node scripts/nsh.mjs update-manifest --entry . --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" -o dist/release "${archives[@]}"
      - name: Publish archives and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "Q Note NSH ${GITHUB_REF_NAME#nsh-}" --generate-notes --latest=false
