[package]
name = "q-note-native"
version = "0.2.12"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.5.0" }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
base64 = "0.22"
auto-launch = "0.5"
nsh-updater = { git = "https://github.com/longbridge/nsh", tag = "v0.5.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
