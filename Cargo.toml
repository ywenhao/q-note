[package]
name = "q-note"
version = "0.2.9"
edition = "2024"
description = "A compact desktop note board built with GPUI"
license = "MIT"
repository = "https://github.com/ywenhao/q-note"
homepage = "https://github.com/ywenhao/q-note#readme"
readme = "README.md"
keywords = ["notes", "desktop", "gpui"]
categories = ["gui"]

[dependencies]
anyhow = "1"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5"
rfd = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tray-icon = "0.21"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", features = ["json"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
