name: CI

on:
  push:
    branches: [main, nsh]
  pull_request:
    branches: [main, nsh]

jobs:
  check:
    name: NSH checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install NSH 0.5.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NSH_VERSION: v0.5.0
        run: |
          $nshInstaller = Join-Path $env:RUNNER_TEMP 'install-nsh.ps1'
          Invoke-WebRequest -Uri 'https://github.com/longbridge/nsh/releases/download/v0.5.0/install.ps1' -OutFile $nshInstaller
          & $nshInstaller
          Join-Path $env:LOCALAPPDATA 'nsh/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install NSH 0.5.0 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NSH_VERSION: v0.5.0
        run: |
          curl -fsSL https://github.com/longbridge/nsh/releases/download/v0.5.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            .nsh/rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: pnpm test
      - run: pnpm test:native
      - run: pnpm test:ui
      - run: pnpm build
