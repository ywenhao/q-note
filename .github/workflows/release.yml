name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    env:
      GH_TOKEN: ${{ github.token }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libclang-dev cmake pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/packages/*.zip
            dist/packages/*.tar.gz
            dist/packages/*.update
            dist/packages/*.update.exe
            dist/packages/*.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          path: dist/packages
          merge-multiple: true
      - run: node scripts/updater.mjs
      - name: Publish native packages and updater manifest
        run: gh release create "$RELEASE_TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" --title "Q Note $RELEASE_TAG" --generate-notes
