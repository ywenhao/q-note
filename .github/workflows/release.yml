name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: q-note-macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: q-note-macos-arm64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: q-note-linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: q-note-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libatk1.0-dev \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.platform != 'windows-latest'
        run: |
          BIN=target/${{ matrix.target }}/release/q-note
          chmod +x "$BIN"
          cp "$BIN" ${{ matrix.artifact }}
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/q-note.exe ${{ matrix.artifact }}.exe
          Compress-Archive -Path ${{ matrix.artifact }}.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Q Note ${{ github.ref_name }}
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
