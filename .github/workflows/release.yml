name: NSH Release

on:
  push:
    tags: ["nsh-v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
    steps:
      - uses: actions/checkout@v7
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-nsh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            .nsh/rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:native
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nsh-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.zip
            dist/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish dedicated NSH release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-nsh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: nsh-*
          merge-multiple: true
          path: dist/release
      - name: Verify tag and create NSH manifest
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "nsh-v$version"
          shopt -s nullglob
          archives=()
          for target in windows macos linux; do
            matches=(dist/release/*-"$version"-"$target"-*.{tar.gz,zip})
            if (( ${#matches[@]} == 0 )); then
              echo "Missing NSH update archive for $target" >&2
              exit 1
            fi
            archives+=("${matches[@]}")
          done
          node scripts/nsh.mjs update-manifest --entry . --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" -o dist/release "${archives[@]}"
      - name: Publish archives and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "Q Note NSH ${GITHUB_REF_NAME#nsh-}" --generate-notes --latest=false
