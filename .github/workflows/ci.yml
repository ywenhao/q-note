name: CI

on:
  push:
    branches: [main, native-shell]
  pull_request:

jobs:
  desktop:
    name: Native desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libclang-dev cmake pkg-config xvfb openbox xdotool xclip imagemagick dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: cargo build -p q-note --locked
      - name: Native window regression
        if: runner.os == 'Linux'
        run: pnpm test:desktop
      - name: Save native screenshots and log
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: native-desktop-smoke
          path: dist/smoke
